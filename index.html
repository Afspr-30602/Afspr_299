<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>KHO THÀNH PHẨM</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 12px;
      background: #f2f4f7;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2937;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      margin: 4px 0 14px;
      text-align: center;
      font-size: 25px;
      font-weight: 700;
    }

    .mode {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 10px;
    }

    button {
      border: 0;
      border-radius: 10px;
      min-height: 46px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .mode button {
      background: #d9dee5;
      color: #374151;
    }

    .mode button.active {
      background: #2563eb;
      color: white;
    }

    .camera-box {
      background: #111827;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }

    #reader {
      width: 100%;
      min-height: 280px;
    }

    #reader video {
      width: 100% !important;
      height: auto !important;
      object-fit: cover;
    }

    .camera-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 8px;
      background: #111827;
    }

    .camera-actions button {
      background: #374151;
      color: white;
    }

    .camera-actions button:disabled {
      opacity: 0.45;
    }

    .card {
      margin-top: 10px;
      padding: 12px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .field {
      margin-bottom: 9px;
    }

    .field:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
      font-weight: 700;
      color: #4b5563;
    }

    input {
      width: 100%;
      height: 44px;
      padding: 0 11px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      background: #f9fafb;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      background: white;
    }

    input[readonly] {
      color: #374151;
      background: #f3f4f6;
    }

    .required {
      color: #dc2626;
    }

    .bottom-actions {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: 8px;
      margin-top: 10px;
    }

    .delete-btn {
      background: #e5e7eb;
      color: #374151;
    }

    .save-btn {
      background: #16a34a;
      color: white;
    }

    .save-btn:disabled,
    .delete-btn:disabled {
      opacity: .5;
    }

    #status {
      margin-top: 10px;
      padding: 11px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      background: #e5e7eb;
      color: #374151;
      display: none;
    }

    #status.success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    #status.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    #status.info {
      display: block;
      background: #dbeafe;
      color: #1e40af;
    }

    .scan-hint {
      padding: 7px 10px;
      text-align: center;
      color: #d1d5db;
      font-size: 13px;
      background: #111827;
    }

    .loading {
      opacity: .65;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>KHO THÀNH PHẨM</h1>

  <div class="mode">
    <button
      id="btnNhap"
      class="active"
      type="button"
      onclick="setMode('NHAP')"
    >
      NHẬP KHO
    </button>

    <button
      id="btnXuat"
      type="button"
      onclick="setMode('XUAT')"
    >
      XUẤT KHO
    </button>
  </div>

  <div class="camera-box">

    <div id="reader"></div>

    <div class="scan-hint" id="scanHint">
      Đưa mã QR vào khung để quét
    </div>

    <div class="camera-actions">

      <button
        id="flashBtn"
        type="button"
        onclick="toggleFlash()"
        disabled
      >
        FLASH
      </button>

      <button
        type="button"
        onclick="startScanner()"
      >
        QUÉT LẠI
      </button>

    </div>

  </div>

  <div class="card">

    <div class="field">
      <label>Mã Lệnh <span class="required">*</span></label>
      <input id="maLenh" type="text" readonly>
    </div>

    <div class="field">
      <label>Khách Hàng <span class="required">*</span></label>
      <input id="khachHang" type="text" readonly>
    </div>

    <div class="field">
      <label>Đơn Hàng <span class="required">*</span></label>
      <input id="donHang" type="text" readonly>
    </div>

    <div class="field">
      <label>Quy Cách Đơn Hàng <span class="required">*</span></label>
      <input id="quyCach" type="text" readonly>
    </div>

    <div class="field">
      <label>Số Lượng Yêu Cầu <span class="required">*</span></label>
      <input id="soLuongYeuCau" type="text" readonly>
    </div>

  </div>

  <div class="card">

    <div class="field">
      <label id="quantityLabel">
        Số Lượng Nhập <span class="required">*</span>
      </label>

      <input
        id="soLuong"
        type="number"
        inputmode="decimal"
        min="0"
        step="any"
        autocomplete="off"
        placeholder="Nhập số lượng"
      >
    </div>

    <div class="field">
      <label id="locationLabel">
        Vị Trí Nhập <span class="required">*</span>
      </label>

      <input
        id="viTri"
        type="text"
        autocomplete="off"
        placeholder="Nhập vị trí"
      >
    </div>

    <div class="field">
      <label>Ghi Chú</label>

      <input
        id="ghiChu"
        type="text"
        autocomplete="off"
        placeholder="Không bắt buộc"
      >
    </div>

  </div>

  <div class="bottom-actions">

    <button
      id="deleteBtn"
      class="delete-btn"
      type="button"
      onclick="clearForm()"
    >
      XÓA
    </button>

    <button
      id="saveBtn"
      class="save-btn"
      type="button"
      onclick="saveData()"
    >
      GHI DỮ LIỆU
    </button>

  </div>

  <div id="status"></div>

</div>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyPukcfexXRyCaYdOvTFlQGFjBG4bZgPinqz7VgSarjzEdQB3paApSYW4x9xzFFiMfv/exec';

const API_TOKEN =
  'QR_KHO_2026';

let mode = 'NHAP';

let scanner = null;
let scannerRunning = false;
let scanLocked = false;
let flashOn = false;
let flashSupported = false;

let lastQrText = '';
let lastQrTime = 0;

const SCAN_COOLDOWN = 1200;


function setMode(newMode) {

  mode = newMode;

  document
    .getElementById('btnNhap')
    .classList.toggle(
      'active',
      mode === 'NHAP'
    );

  document
    .getElementById('btnXuat')
    .classList.toggle(
      'active',
      mode === 'XUAT'
    );

  document.getElementById('quantityLabel').innerHTML =
    mode === 'NHAP'
      ? 'Số Lượng Nhập <span class="required">*</span>'
      : 'Số Lượng Xuất <span class="required">*</span>';

  document.getElementById('locationLabel').innerHTML =
    mode === 'NHAP'
      ? 'Vị Trí Nhập <span class="required">*</span>'
      : 'Vị Trí Xuất <span class="required">*</span>';

  showStatus(
    mode === 'NHAP'
      ? 'Đang ở chế độ NHẬP KHO'
      : 'Đang ở chế độ XUẤT KHO',
    'info'
  );
}


function getReaderConfig() {

  return {
    fps: 12,

    qrbox: function(viewfinderWidth, viewfinderHeight) {

      const size =
        Math.min(
          viewfinderWidth,
          viewfinderHeight
        ) * 0.68;

      return {
        width: Math.floor(size),
        height: Math.floor(size)
      };
    },

    aspectRatio: 1,

    formatsToSupport: [
      Html5QrcodeSupportedFormats.QR_CODE
    ],

    rememberLastUsedCamera: true
  };
}


async function startScanner() {

  if (scanLocked) {
    return;
  }

  if (!scanner) {

    scanner =
      new Html5Qrcode('reader');

  } else if (scannerRunning) {

    return;

  }

  flashOn = false;
  flashSupported = false;

  document
    .getElementById('flashBtn')
    .disabled = true;

  try {

    showStatus(
      'Đang mở camera...',
      'info'
    );

    await scanner.start(
      {
        facingMode: {
          ideal: 'environment'
        }
      },

      getReaderConfig(),

      onScanSuccess,

      onScanFailure

    );

    scannerRunning = true;

    checkFlashSupport();

    showStatus(
      'Sẵn sàng quét QR',
      'info'
    );

  } catch (error) {

    scannerRunning = false;

    try {

      const cameras =
        await Html5Qrcode.getCameras();

      if (
        cameras &&
        cameras.length > 0
      ) {

        const backCamera =
          cameras.find(camera =>
            /back|rear|environment/i.test(
              camera.label || ''
            )
          ) || cameras[cameras.length - 1];

        await scanner.start(
          backCamera.id,
          getReaderConfig(),
          onScanSuccess,
          onScanFailure
        );

        scannerRunning = true;

        checkFlashSupport();

        showStatus(
          'Sẵn sàng quét QR',
          'info'
        );

        return;
      }

    } catch (secondError) {
    }

    showStatus(
      'Không thể mở camera. Hãy cấp quyền camera cho trình duyệt.',
      'error'
    );
  }
}


function onScanFailure() {
}


async function onScanSuccess(decodedText) {

  if (scanLocked) {
    return;
  }

  const now = Date.now();

  if (
    decodedText === lastQrText &&
    now - lastQrTime < SCAN_COOLDOWN
  ) {
    return;
  }

  lastQrText = decodedText;
  lastQrTime = now;

  scanLocked = true;

  await stopScanner();

  const success =
    parseQr(decodedText);

  if (!success) {

    scanLocked = false;

    setTimeout(
      startScanner,
      300
    );
  }
}


function parseQr(text) {

  const parts =
    String(text)
      .split('|')
      .map(value => value.trim());

  if (parts.length !== 5) {

    showStatus(
      'QR không đúng định dạng. QR phải có 5 trường.',
      'error'
    );

    return false;
  }

  const [
    maLenh,
    khachHang,
    donHang,
    quyCach,
    soLuongYeuCau
  ] = parts;

  if (!maLenh) {

    showStatus(
      'QR thiếu Mã Lệnh.',
      'error'
    );

    return false;
  }

  if (!khachHang) {

    showStatus(
      'QR thiếu Khách Hàng.',
      'error'
    );

    return false;
  }

  if (!donHang) {

    showStatus(
      'QR thiếu Đơn Hàng.',
      'error'
    );

    return false;
  }

  if (!quyCach) {

    showStatus(
      'QR thiếu Quy Cách Đơn Hàng.',
      'error'
    );

    return false;
  }

  if (!soLuongYeuCau) {

    showStatus(
      'QR thiếu Số Lượng Yêu Cầu.',
      'error'
    );

    return false;
  }

  document.getElementById('maLenh').value =
    maLenh;

  document.getElementById('khachHang').value =
    khachHang;

  document.getElementById('donHang').value =
    donHang;

  document.getElementById('quyCach').value =
    quyCach;

  document.getElementById('soLuongYeuCau').value =
    soLuongYeuCau;

  document.getElementById('soLuong').value =
    '';

  document.getElementById('viTri').value =
    '';

  document.getElementById('ghiChu').value =
    '';

  document.getElementById('soLuong').focus();

  showStatus(
    'Đã quét QR. Nhập số lượng và vị trí.',
    'success'
  );

  return true;
}


async function stopScanner() {

  if (
    !scanner ||
    !scannerRunning
  ) {
    return;
  }

  try {

    await scanner.stop();

  } catch (error) {
  }

  scannerRunning = false;

  flashOn = false;
  flashSupported = false;

  document
    .getElementById('flashBtn')
    .disabled = true;
}


async function checkFlashSupport() {

  if (
    !scanner ||
    !scannerRunning
  ) {
    return;
  }

  try {

    const capabilities =
      scanner.getRunningTrackCapabilities();

    if (
      capabilities &&
      capabilities.torch
    ) {

      flashSupported = true;

      document
        .getElementById('flashBtn')
        .disabled = false;

    } else {

      flashSupported = false;

      document
        .getElementById('flashBtn')
        .disabled = true;
    }

  } catch (error) {

    flashSupported = false;

    document
      .getElementById('flashBtn')
      .disabled = true;
  }
}


async function toggleFlash() {

  if (
    !scanner ||
    !scannerRunning ||
    !flashSupported
  ) {
    return;
  }

  try {

    flashOn = !flashOn;

    await scanner.applyVideoConstraints({
      advanced: [
        {
          torch: flashOn
        }
      ]
    });

    document.getElementById('flashBtn').textContent =
      flashOn
        ? 'TẮT FLASH'
        : 'FLASH';

  } catch (error) {

    flashOn = false;

    document.getElementById('flashBtn').textContent =
      'FLASH';

    showStatus(
      'Thiết bị không hỗ trợ Flash camera.',
      'error'
    );
  }
}


function getValue(id) {

  return String(
    document.getElementById(id).value || ''
  ).trim();
}


function generateRequestId() {

  return (
    Date.now().toString(36) +
    '_' +
    Math.random()
      .toString(36)
      .slice(2, 12)
  );
}


function buildParams(requestId) {

  return {
    token: API_TOKEN,
    action: 'save',
    mode: mode,
    source: 'QR',
    requestId: requestId,

    maLenh:
      getValue('maLenh'),

    khachHang:
      getValue('khachHang'),

    donHang:
      getValue('donHang'),

    quyCach:
      getValue('quyCach'),

    soLuongYeuCau:
      getValue('soLuongYeuCau'),

    soLuong:
      getValue('soLuong'),

    viTri:
      getValue('viTri'),

    ghiChu:
      getValue('ghiChu')
  };
}


function validateForm() {

  if (!getValue('maLenh')) {

    showStatus(
      'Chưa có Mã Lệnh. Hãy quét QR.',
      'error'
    );

    return false;
  }

  if (!getValue('khachHang')) {

    showStatus(
      'Chưa có Khách Hàng. Hãy quét QR.',
      'error'
    );

    return false;
  }

  if (!getValue('donHang')) {

    showStatus(
      'Chưa có Đơn Hàng. Hãy quét QR.',
      'error'
    );

    return false;
  }

  if (!getValue('quyCach')) {

    showStatus(
      'Chưa có Quy Cách Đơn Hàng. Hãy quét QR.',
      'error'
    );

    return false;
  }

  if (!getValue('soLuongYeuCau')) {

    showStatus(
      'Chưa có Số Lượng Yêu Cầu. Hãy quét QR.',
      'error'
    );

    return false;
  }

  const quantity =
    Number(
      getValue('soLuong')
        .replace(',', '.')
    );

  if (
    !Number.isFinite(quantity) ||
    quantity <= 0
  ) {

    showStatus(
      mode === 'NHAP'
        ? 'Số Lượng Nhập phải lớn hơn 0.'
        : 'Số Lượng Xuất phải lớn hơn 0.',
      'error'
    );

    return false;
  }

  if (!getValue('viTri')) {

    showStatus(
      mode === 'NHAP'
        ? 'Vui lòng nhập Vị Trí Nhập.'
        : 'Vui lòng nhập Vị Trí Xuất.',
      'error'
    );

    return false;
  }

  return true;
}


function saveData() {

  if (!validateForm()) {
    return;
  }

  const saveButton =
    document.getElementById('saveBtn');

  const deleteButton =
    document.getElementById('deleteBtn');

  saveButton.disabled = true;
  deleteButton.disabled = true;

  saveButton.textContent =
    'ĐANG GHI...';

  showStatus(
    'Đang gửi dữ liệu...',
    'info'
  );

  const requestId =
    generateRequestId();

  const params =
    buildParams(requestId);

  sendWithRetry(
    params,
    2
  )
    .then(result => {

      if (
        result &&
        result.success
      ) {

        showStatus(
          result.message ||
          'Đã ghi dữ liệu thành công.',
          'success'
        );

        clearTransactionFields();

        setTimeout(() => {

          scanLocked = false;

          startScanner();

        }, 500);

      } else {

        throw new Error(
          result &&
          result.message
            ? result.message
            : 'Không thể ghi dữ liệu.'
        );
      }

    })
    .catch(error => {

      showStatus(
        error.message ||
        'Không thể kết nối với hệ thống.',
        'error'
      );

      scanLocked = false;

    })
    .finally(() => {

      saveButton.disabled = false;
      deleteButton.disabled = false;

      saveButton.textContent =
        'GHI DỮ LIỆU';
    });
}


function sendWithRetry(
  params,
  attempts
) {

  return sendJsonp(params)
    .catch(error => {

      if (attempts <= 1) {
        throw error;
      }

      return new Promise(resolve =>
        setTimeout(
          resolve,
          300
        )
      )
        .then(() =>
          sendJsonp(params)
        );
    });
}


function sendJsonp(params) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        'qrCallback_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2, 8);

      let finished = false;

      const script =
        document.createElement('script');

      const query =
        new URLSearchParams({
          ...params,
          callback: callbackName
        });

      const timer =
        setTimeout(() => {

          if (finished) {
            return;
          }

          finished = true;

          cleanup();

          reject(
            new Error(
              'Hệ thống phản hồi quá thời gian.'
            )
          );

        }, 12000);

      window[callbackName] =
        function(result) {

          if (finished) {
            return;
          }

          finished = true;

          clearTimeout(timer);

          cleanup();

          resolve(result);
        };

      script.src =
        API_URL +
        '?' +
        query.toString();

      script.async = true;

      script.onerror =
        function() {

          if (finished) {
            return;
          }

          finished = true;

          clearTimeout(timer);

          cleanup();

          reject(
            new Error(
              'Không thể kết nối với hệ thống.'
            )
          );
        };

      document
        .head
        .appendChild(script);


      function cleanup() {

        try {
          script.remove();
        } catch (error) {
        }

        try {
          delete window[callbackName];
        } catch (error) {
          window[callbackName] =
            undefined;
        }
      }

    }
  );
}


function clearTransactionFields() {

  document.getElementById('soLuong').value =
    '';

  document.getElementById('viTri').value =
    '';

  document.getElementById('ghiChu').value =
    '';
}


function clearForm() {

  document.getElementById('maLenh').value =
    '';

  document.getElementById('khachHang').value =
    '';

  document.getElementById('donHang').value =
    '';

  document.getElementById('quyCach').value =
    '';

  document.getElementById('soLuongYeuCau').value =
    '';

  document.getElementById('soLuong').value =
    '';

  document.getElementById('viTri').value =
    '';

  document.getElementById('ghiChu').value =
    '';

  lastQrText = '';
  lastQrTime = 0;

  scanLocked = false;

  showStatus(
    'Đã xóa dữ liệu.',
    'info'
  );

  if (!scannerRunning) {
    startScanner();
  }
}


function showStatus(
  message,
  type
) {

  const status =
    document.getElementById('status');

  status.textContent =
    message;

  status.className =
    type || 'info';
}


window.addEventListener(
  'load',
  function() {

    setMode('NHAP');

    startScanner();

  }
);


document.addEventListener(
  'visibilitychange',
  function() {

    if (
      document.hidden &&
      scannerRunning
    ) {

      stopScanner();
    }

  }
);

</script>

</body>
</html>
