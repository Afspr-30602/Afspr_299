<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111827">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://unpkg.com">
<title>NHẬP XUẤT KHO</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f4f6;
  color:#111827;
}

.container{
  width:100%;
  max-width:600px;
  margin:0 auto;
  padding:16px;
}

h1{
  text-align:center;
  margin:4px 0 18px;
  font-size:25px;
}

.mode-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:12px;
}

.mode-btn{
  border:0;
  border-radius:12px;
  padding:14px;
  font-size:17px;
  font-weight:700;
  background:#d1d5db;
  color:#111827;
}

.mode-btn.active{
  background:#111827;
  color:white;
}

.source-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

.source-btn{
  border:1px solid #9ca3af;
  border-radius:10px;
  padding:12px;
  font-size:16px;
  font-weight:700;
  background:white;
}

.source-btn.active{
  background:#2563eb;
  color:white;
  border-color:#2563eb;
}

.card{
  background:white;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:12px;
}

label{
  display:block;
  font-weight:600;
  margin:10px 0 6px;
}

input{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font-size:16px;
  background:white;
}

input[readonly]{
  background:#f8fafc;
}

#readerWrap{
  position:relative;
  width:100%;
  border-radius:14px;
  overflow:hidden;
  background:#000;
}

#reader{
  width:100%;
  min-height:280px;
}

#torchBtn{
  position:absolute;
  top:12px;
  right:12px;
  z-index:20;
  border:0;
  border-radius:12px;
  padding:10px 14px;
  background:rgba(17,24,39,.78);
  color:white;
  font-size:16px;
  font-weight:700;
  backdrop-filter:blur(4px);
}

#torchBtn.on{
  background:#f59e0b;
  color:#111827;
}

#torchBtn:disabled{
  opacity:.5;
}

.qr-status{
  text-align:center;
  font-size:14px;
  margin:10px 0 0;
  color:#475569;
}

.buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button.action{
  border:0;
  border-radius:10px;
  padding:14px;
  font-size:17px;
  font-weight:700;
}

.clear-btn{
  background:#e5e7eb;
  color:#111827;
}

.save-btn{
  background:#2563eb;
  color:white;
}

.save-btn:disabled{
  opacity:.6;
}

.hidden{
  display:none !important;
}

.error{
  color:#b91c1c;
  background:#fee2e2;
  border-radius:12px;
  padding:14px;
  text-align:center;
  font-weight:700;
  margin-top:14px;
}

.success{
  color:#15803d;
  background:#dcfce7;
  border-radius:12px;
  padding:14px;
  text-align:center;
  font-weight:700;
  margin-top:14px;
}
</style>
</head>

<body>

<div class="container">

  <h1>NHẬP XUẤT KHO</h1>

  <div class="mode-buttons">
    <button id="nhapBtn" class="mode-btn active" onclick="setMode('NHAP')">
      NHẬP KHO
    </button>

    <button id="xuatBtn" class="mode-btn" onclick="setMode('XUAT')">
      XUẤT KHO
    </button>
  </div>

  <div class="source-buttons">
    <button id="qrBtn" class="source-btn active" onclick="setSource('QR')">
      📷 Quét QR
    </button>

    <button id="manualBtn" class="source-btn" onclick="setSource('MANUAL')">
      ⌨️ Nhập tay
    </button>
  </div>

  <div id="qrSection" class="card">

    <div class="card-title">Quét mã QR</div>

    <div id="readerWrap">

      <div id="reader"></div>

      <button id="torchBtn" onclick="toggleTorch()">
        🔦 FLASH
      </button>

    </div>

    <div id="qrStatus" class="qr-status">
      Đưa mã QR vào khung để quét
    </div>

  </div>

  <div class="card">

    <div class="card-title">Thông tin đơn hàng</div>

    <label for="maLenh">Mã Lệnh</label>
    <input id="maLenh" type="text" readonly>

    <label for="khachHang">Khách Hàng</label>
    <input id="khachHang" type="text" readonly>

    <label for="donHang">Đơn Hàng</label>
    <input id="donHang" type="text" readonly>

    <label for="quyCach">Quy Cách Đơn Hàng</label>
    <input id="quyCach" type="text" readonly>

    <label for="soLuongYeuCau">Số Lượng Yêu Cầu</label>
    <input id="soLuongYeuCau" type="text" readonly>

  </div>

  <div class="card">

    <div class="card-title">Thông tin kho</div>

    <label id="soLuongLabel" for="soLuong">Số Lượng Nhập</label>
    <input
      id="soLuong"
      type="text"
      inputmode="decimal"
      autocomplete="off"
    >

    <label id="viTriLabel" for="viTri">Vị Trí Nhập</label>
    <input
      id="viTri"
      type="text"
      autocomplete="off"
    >

    <label for="ghiChu">Ghi Chú</label>
    <input
      id="ghiChu"
      type="text"
      autocomplete="off"
    >

  </div>

  <div class="buttons">

    <button class="action clear-btn" onclick="clearForm()">
      XÓA
    </button>

    <button class="action save-btn" onclick="saveData()">
      💾 GHI DỮ LIỆU
    </button>

  </div>

  <div id="message"></div>

</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyPukcfexXRyCaYdOvTFlQGFjBG4bZgPinqz7VgSarjzEdQB3paApSYW4x9xzFFiMfv/exec';

const API_TOKEN = 'QR_KHO_2026';

let currentMode = 'NHAP';
let currentSource = 'QR';

let html5QrCode = null;
let scannerRunning = false;
let scanLocked = false;
let torchOn = false;

const fields = {
  maLenh: document.getElementById('maLenh'),
  khachHang: document.getElementById('khachHang'),
  donHang: document.getElementById('donHang'),
  quyCach: document.getElementById('quyCach'),
  soLuongYeuCau: document.getElementById('soLuongYeuCau'),
  soLuong: document.getElementById('soLuong'),
  viTri: document.getElementById('viTri'),
  ghiChu: document.getElementById('ghiChu')
};

function setMode(mode) {
  currentMode = mode;

  document.getElementById('nhapBtn')
    .classList.toggle('active', mode === 'NHAP');

  document.getElementById('xuatBtn')
    .classList.toggle('active', mode === 'XUAT');

  document.getElementById('soLuongLabel').textContent =
    mode === 'NHAP'
      ? 'Số Lượng Nhập'
      : 'Số Lượng Xuất';

  document.getElementById('viTriLabel').textContent =
    mode === 'NHAP'
      ? 'Vị Trí Nhập'
      : 'Vị Trí Xuất';

  clearMessage();
}

function setSource(source) {
  currentSource = source;

  document.getElementById('qrBtn')
    .classList.toggle('active', source === 'QR');

  document.getElementById('manualBtn')
    .classList.toggle('active', source === 'MANUAL');

  const qrSection =
    document.getElementById('qrSection');

  if (source === 'QR') {

    qrSection.classList.remove('hidden');

    fields.maLenh.readOnly = true;
    fields.khachHang.readOnly = true;
    fields.donHang.readOnly = true;
    fields.quyCach.readOnly = true;
    fields.soLuongYeuCau.readOnly = true;

    clearMessage();

    startScanner();

  } else {

    qrSection.classList.add('hidden');

    fields.maLenh.readOnly = false;
    fields.khachHang.readOnly = false;
    fields.donHang.readOnly = false;
    fields.quyCach.readOnly = false;
    fields.soLuongYeuCau.readOnly = false;

    stopScanner();
  }
}

function parseQrText(text) {
  const parts = String(text || '')
    .split('|')
    .map(v => v.trim());

  if (parts.length !== 5) {
    throw new Error(
      'Mã QR phải có đúng 5 trường.'
    );
  }

  if (parts.some(v => !v)) {
    throw new Error(
      'Mã QR đang thiếu thông tin.'
    );
  }

  const quantity =
    parseNumber(parts[4]);

  if (
    quantity === null ||
    quantity <= 0
  ) {
    throw new Error(
      'Số Lượng Yêu Cầu trong QR không hợp lệ.'
    );
  }

  return {
    maLenh: parts[0],
    khachHang: parts[1],
    donHang: parts[2],
    quyCach: parts[3],
    soLuongYeuCau: parts[4]
  };
}

function onScanSuccess(decodedText) {

  if (scanLocked) {
    return;
  }

  try {

    const data =
      parseQrText(decodedText);

    scanLocked = true;

    fields.maLenh.value =
      data.maLenh;

    fields.khachHang.value =
      data.khachHang;

    fields.donHang.value =
      data.donHang;

    fields.quyCach.value =
      data.quyCach;

    fields.soLuongYeuCau.value =
      data.soLuongYeuCau;

    document.getElementById('qrStatus').textContent =
      '✓ Đã quét QR — nhập thông tin kho rồi ghi dữ liệu';

    showSuccess(
      'Đã nhận dữ liệu từ QR.'
    );

  } catch (error) {

    showError(
      error.message
    );
  }
}

async function startScanner() {

  if (scannerRunning) {
    return;
  }

  scanLocked = false;
  torchOn = false;

  const reader =
    document.getElementById('reader');

  reader.innerHTML = '';

  document.getElementById('torchBtn')
    .classList.remove('on');

  document.getElementById('torchBtn').textContent =
    '🔦 FLASH';

  html5QrCode =
    new Html5Qrcode(
      'reader',
      {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.QR_CODE
        ],
        useBarCodeDetectorIfSupported: true,
        verbose: false
      }
    );

  try {

    let cameraId = null;

    const cameras =
      await Html5Qrcode.getCameras();

    if (
      !cameras ||
      cameras.length === 0
    ) {
      throw new Error(
        'Không tìm thấy camera.'
      );
    }

    for (
      const camera of cameras
    ) {

      const label =
        String(
          camera.label || ''
        ).toLowerCase();

      if (
        label.includes('back') ||
        label.includes('rear') ||
        label.includes('environment')
      ) {
        cameraId = camera.id;
        break;
      }
    }

    if (!cameraId) {
      cameraId = cameras[0].id;
    }

    await html5QrCode.start(

      cameraId,

      {
        fps: 15,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const width =
            Math.floor(
              Math.min(
                viewfinderWidth * 0.68,
                viewfinderHeight * 0.68,
                330
              )
            );

          const height =
            Math.floor(
              Math.min(
                viewfinderWidth * 0.68,
                viewfinderHeight * 0.68,
                330
              )
            );

          return {
            width,
            height
          };
        },

        aspectRatio: 1.333333,

        disableFlip: true
      },

      onScanSuccess,

      function() {}
    );

    scannerRunning = true;

    updateTorchAvailability();

    document.getElementById('qrStatus').textContent =
      'Đưa mã QR vào khung để quét';

  } catch (error) {

    scannerRunning = false;

    document.getElementById('qrStatus').textContent =
      'Không thể mở camera.';

    showError(
      error.message ||
      'Không thể mở camera.'
    );
  }
}

function stopScanner() {

  if (!html5QrCode) {
    return;
  }

  if (!scannerRunning) {
    return;
  }

  try {

    if (torchOn) {
      html5QrCode
        .applyVideoConstraints({
          advanced: [
            {
              torch: false
            }
          ]
        })
        .catch(() => {});
    }

  } catch (e) {}

  html5QrCode
    .stop()
    .then(() => {

      scannerRunning = false;
      torchOn = false;

      return html5QrCode.clear();

    })
    .catch(() => {

      scannerRunning = false;
      torchOn = false;
    });
}

function updateTorchAvailability() {

  const button =
    document.getElementById('torchBtn');

  button.disabled = true;

  try {

    const capabilities =
      html5QrCode
        .getRunningTrackCapabilities();

    if (
      capabilities &&
      capabilities.torch
    ) {

      button.disabled = false;

    } else {

      button.disabled = true;

    }

  } catch (error) {

    button.disabled = true;
  }
}

async function toggleTorch() {

  if (
    !html5QrCode ||
    !scannerRunning
  ) {
    return;
  }

  const button =
    document.getElementById('torchBtn');

  if (button.disabled) {
    showError(
      'Thiết bị hoặc trình duyệt không hỗ trợ đèn flash.'
    );
    return;
  }

  try {

    await html5QrCode.applyVideoConstraints({
      advanced: [
        {
          torch: !torchOn
        }
      ]
    });

    torchOn = !torchOn;

    button.classList.toggle(
      'on',
      torchOn
    );

    button.textContent =
      torchOn
        ? '🔆 TẮT FLASH'
        : '🔦 FLASH';

  } catch (error) {

    showError(
      'Không thể bật/tắt đèn flash trên thiết bị này.'
    );
  }
}

function parseNumber(value) {

  const text =
    String(value || '')
      .trim()
      .replace(/,/g, '.');

  if (!text) {
    return null;
  }

  const number =
    Number(text);

  if (!Number.isFinite(number)) {
    return null;
  }

  return number;
}

function createRequestId() {

  if (
    window.crypto &&
    typeof window.crypto.randomUUID === 'function'
  ) {
    return window.crypto.randomUUID();
  }

  return (
    Date.now() +
    '_' +
    Math.random()
      .toString(36)
      .substring(2) +
    '_' +
    Math.random()
      .toString(36)
      .substring(2)
  );
}

function callAppsScript(params) {

  return new Promise(
    (resolve, reject) => {

      const callbackName =
        'qrKhoCallback_' +
        Date.now() +
        '_' +
        Math.floor(
          Math.random() * 1000000
        );

      params.set(
        'callback',
        callbackName
      );

      const script =
        document.createElement('script');

      let finished = false;

      const cleanup = () => {

        if (script.parentNode) {
          script.parentNode.removeChild(
            script
          );
        }

        try {
          delete window[callbackName];
        } catch (e) {
          window[callbackName] = undefined;
        }
      };

      const timer =
        setTimeout(() => {

          if (finished) {
            return;
          }

          finished = true;

          cleanup();

          reject(
            new Error(
              'Hết thời gian chờ hệ thống.'
            )
          );

        }, 15000);

      window[callbackName] =
        function(result) {

          if (finished) {
            return;
          }

          finished = true;

          clearTimeout(timer);

          cleanup();

          resolve(result);
        };

      script.onerror =
        function() {

          if (finished) {
            return;
          }

          finished = true;

          clearTimeout(timer);

          cleanup();

          reject(
            new Error(
              'Không thể kết nối với hệ thống.'
            )
          );
        };

      script.async = true;

      script.src =
        API_URL +
        '?' +
        params.toString();

      document.body.appendChild(
        script
      );
    }
  );
}

async function saveData() {

  clearMessage();

  const soLuong =
    fields.soLuong.value.trim();

  const viTri =
    fields.viTri.value.trim();

  if (!soLuong) {

    showError(
      currentMode === 'NHAP'
        ? 'Vui lòng nhập Số Lượng Nhập.'
        : 'Vui lòng nhập Số Lượng Xuất.'
    );

    return;
  }

  const quantity =
    parseNumber(soLuong);

  if (
    quantity === null ||
    quantity <= 0
  ) {

    showError(
      currentMode === 'NHAP'
        ? 'Số Lượng Nhập không hợp lệ.'
        : 'Số Lượng Xuất không hợp lệ.'
    );

    return;
  }

  if (!viTri) {

    showError(
      currentMode === 'NHAP'
        ? 'Vui lòng nhập Vị Trí Nhập.'
        : 'Vui lòng nhập Vị Trí Xuất.'
    );

    return;
  }

  if (currentSource === 'QR') {

    if (
      !fields.maLenh.value.trim() ||
      !fields.khachHang.value.trim() ||
      !fields.donHang.value.trim() ||
      !fields.quyCach.value.trim() ||
      !fields.soLuongYeuCau.value.trim()
    ) {

      showError(
        'Vui lòng quét QR đầy đủ thông tin.'
      );

      return;
    }
  }

  const params =
    new URLSearchParams();

  params.set(
    'token',
    API_TOKEN
  );

  params.set(
    'action',
    'save'
  );

  params.set(
    'mode',
    currentMode
  );

  params.set(
    'source',
    currentSource
  );

  params.set(
    'requestId',
    createRequestId()
  );

  params.set(
    'maLenh',
    fields.maLenh.value.trim()
  );

  params.set(
    'khachHang',
    fields.khachHang.value.trim()
  );

  params.set(
    'donHang',
    fields.donHang.value.trim()
  );

  params.set(
    'quyCach',
    fields.quyCach.value.trim()
  );

  params.set(
    'soLuongYeuCau',
    fields.soLuongYeuCau.value.trim()
  );

  params.set(
    'soLuong',
    fields.soLuong.value.trim()
  );

  params.set(
    'viTri',
    fields.viTri.value.trim()
  );

  params.set(
    'ghiChu',
    fields.ghiChu.value.trim()
  );

  const saveButton =
    document.querySelector(
      '.save-btn'
    );

  saveButton.disabled = true;
  saveButton.textContent =
    'ĐANG GHI...';

  try {

    const result =
      await callAppsScript(
        params
      );

    if (
      result &&
      result.success
    ) {

      showSuccess(
        result.message ||
        'Đã ghi dữ liệu thành công.'
      );

      fields.soLuong.value = '';
      fields.viTri.value = '';
      fields.ghiChu.value = '';

      scanLocked = false;

      document.getElementById(
        'qrStatus'
      ).textContent =
        'Đưa mã QR tiếp theo vào khung để quét';

      return;
    }

    showError(
      result &&
      result.message
        ? result.message
        : 'Không thể ghi dữ liệu.'
    );

  } catch (error) {

    showError(
      error.message ||
      'Không thể kết nối với hệ thống.'
    );

  } finally {

    saveButton.disabled = false;
    saveButton.textContent =
      '💾 GHI DỮ LIỆU';
  }
}

function clearForm() {

  fields.maLenh.value = '';
  fields.khachHang.value = '';
  fields.donHang.value = '';
  fields.quyCach.value = '';
  fields.soLuongYeuCau.value = '';
  fields.soLuong.value = '';
  fields.viTri.value = '';
  fields.ghiChu.value = '';

  clearMessage();

  scanLocked = false;

  if (currentSource === 'QR') {

    document.getElementById(
      'qrStatus'
    ).textContent =
      'Đưa mã QR vào khung để quét';

    if (!scannerRunning) {
      startScanner();
    }
  }
}

function showError(message) {

  const el =
    document.getElementById(
      'message'
    );

  el.className = 'error';
  el.textContent = message;
}

function showSuccess(message) {

  const el =
    document.getElementById(
      'message'
    );

  el.className = 'success';
  el.textContent = message;
}

function clearMessage() {

  const el =
    document.getElementById(
      'message'
    );

  el.className = '';
  el.textContent = '';
}

window.addEventListener(
  'load',
  () => {

    setMode('NHAP');
    setSource('QR');

  }
);
</script>

</body>
</html>
