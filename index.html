<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Kho QR</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: #f4f6f8;
  font-family: Arial, sans-serif;
  color: #222;
}

.container {
  max-width: 650px;
  margin: auto;
}

h1 {
  text-align: center;
  margin: 8px 0 18px;
}

.mode-buttons {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 13px 16px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.mode-btn {
  flex: 1;
  background: #ddd;
}

.mode-btn.active {
  background: #1677ff;
  color: white;
}

.card {
  background: white;
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

label {
  display: block;
  font-weight: bold;
  margin: 12px 0 6px;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  border: 1px solid #ccc;
  border-radius: 9px;
  font-size: 16px;
}

input[readonly] {
  background: #f0f2f4;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

#reader {
  width: 100%;
  overflow: hidden;
  border-radius: 12px;
}

.camera-buttons {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}

.camera-buttons button {
  flex: 1;
}

.primary {
  width: 100%;
  background: #1677ff;
  color: white;
  margin-top: 16px;
}

.danger {
  width: 100%;
  background: #e53935;
  color: white;
  margin-top: 10px;
}

.flash {
  background: #ffb300;
  color: #111;
}

.status {
  text-align: center;
  padding: 10px;
  margin-bottom: 12px;
  border-radius: 9px;
  background: #eef2f5;
  font-weight: bold;
}

.success {
  background: #dff6e4;
  color: #137333;
}

.error {
  background: #fde1e1;
  color: #b42318;
}

.hidden {
  display: none !important;
}

.lock-message {
  text-align: center;
  margin-top: 10px;
  font-weight: bold;
  color: #555;
}

</style>

</head>

<body>

<div class="container">

<h1>NHẬP / XUẤT KHO QR</h1>

<div class="mode-buttons">

<button
  id="btnNhap"
  class="mode-btn active"
  onclick="setMode('NHAP')"
>
NHẬP KHO
</button>

<button
  id="btnXuat"
  class="mode-btn"
  onclick="setMode('XUAT')"
>
XUẤT KHO
</button>

</div>

<div
  id="status"
  class="status"
>
Sẵn sàng quét QR
</div>

<div class="card">

<div id="reader"></div>

<div class="camera-buttons">

<button
  id="flashBtn"
  class="flash"
  onclick="toggleFlash()"
>
🔦 Flash
</button>

<button
  onclick="startScanner()"
>
📷 Quét lại
</button>

</div>

<div
  id="lockMessage"
  class="lock-message hidden"
>
Đã quét — camera đã khóa
</div>

</div>

<div
  id="orderInfoCard"
  class="card"
>

<h3>Thông tin đơn hàng - TEST 999</h3>

<label>Khách Hàng</label>

<input
  id="khachHang"
  readonly
>

<label>Đơn Hàng</label>

<input
  id="donHang"
  readonly
>

<label>Mã Lệnh</label>

<input
  id="maLenh"
  readonly
>

<label>Quy Cách Đơn Hàng</label>

<input
  id="quyCach"
  readonly
>

<label>Số Lượng Yêu Cầu</label>

<input
  id="soLuongYeuCau"
  readonly
>

</div>

<div class="card">

<h3 id="quantityTitle">
Thông tin nhập kho
</h3>

<label id="quantityLabel">
Số Lượng Nhập
</label>

<input
  id="soLuong"
  type="text"
  inputmode="decimal"
  placeholder="Nhập số lượng"
>

<label id="locationLabel">
Vị Trí Nhập
</label>

<input
  id="viTri"
  type="text"
  placeholder="Ví dụ: A01-01"
>

<label>
Ghi Chú
</label>

<textarea
  id="ghiChu"
  placeholder="Ghi chú nếu có..."
></textarea>

<button
  id="saveBtn"
  class="primary"
  onclick="saveData()"
>
💾 LƯU DỮ LIỆU
</button>

<button
  class="danger"
  onclick="clearForm()"
>
🗑 XÓA
</button>

</div>

</div>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyPukcfexXRyCaYdOvTFlQGFjBG4bZgPinqz7VgSarjzEdQB3paApSYW4x9xzFFiMfv/exec';

const API_TOKEN =
  'QR_KHO_2026';

let currentMode =
  'NHAP';

let scanner =
  null;

let scannerRunning =
  false;

let scanLocked =
  false;

let flashOn =
  false;

let currentCameraId =
  null;

const statusEl =
  document.getElementById(
    'status'
  );

const lockMessageEl =
  document.getElementById(
    'lockMessage'
  );


function setMode(
  mode
) {

  currentMode =
    mode;

  document
    .getElementById(
      'btnNhap'
    )
    .classList.toggle(
      'active',
      mode === 'NHAP'
    );

  document
    .getElementById(
      'btnXuat'
    )
    .classList.toggle(
      'active',
      mode === 'XUAT'
    );

  document
    .getElementById(
      'quantityTitle'
    )
    .textContent =
      mode === 'NHAP'
        ? 'Thông tin nhập kho'
        : 'Thông tin xuất kho';

  document
    .getElementById(
      'quantityLabel'
    )
    .textContent =
      mode === 'NHAP'
        ? 'Số Lượng Nhập'
        : 'Số Lượng Xuất';

  document
    .getElementById(
      'locationLabel'
    )
    .textContent =
      mode === 'NHAP'
        ? 'Vị Trí Nhập'
        : 'Vị Trí Xuất';

  updateStatus(
    'Đã chọn ' +
    (
      mode === 'NHAP'
        ? 'NHẬP KHO'
        : 'XUẤT KHO'
    ) +
    '. Sẵn sàng quét QR.',
    ''
  );

}


function updateStatus(
  message,
  type
) {

  statusEl.textContent =
    message;

  statusEl.className =
    'status';

  if (type) {

    statusEl.classList.add(
      type
    );

  }

}


function createRequestId() {

  return (
    Date.now().toString(36) +
    '_' +
    Math.random()
      .toString(36)
      .substring(2, 12)
  );

}


function parseQrText(
  text
) {

  const parts =
    String(
      text || ''
    )
    .split('|')
    .map(
      value =>
        value.trim()
    );

  if (
    parts.length !== 5
  ) {

    throw new Error(
      'QR phải có đúng 5 trường: Khách Hàng | Đơn Hàng | Mã Lệnh | Quy Cách Đơn Hàng | Số Lượng Yêu Cầu'
    );

  }

  const khachHang =
    parts[0];

  const donHang =
    parts[1];

  const maLenh =
    parts[2];

  const quyCach =
    parts[3];

  const soLuongYeuCau =
    parts[4];

  if (!khachHang) {

    throw new Error(
      'QR thiếu Khách Hàng.'
    );

  }

  if (!donHang) {

    throw new Error(
      'QR thiếu Đơn Hàng.'
    );

  }

  if (!maLenh) {

    throw new Error(
      'QR thiếu Mã Lệnh.'
    );

  }

  if (!quyCach) {

    throw new Error(
      'QR thiếu Quy Cách Đơn Hàng.'
    );

  }

  if (!soLuongYeuCau) {

    throw new Error(
      'QR thiếu Số Lượng Yêu Cầu.'
    );

  }

  return {
    khachHang,
    donHang,
    maLenh,
    quyCach,
    soLuongYeuCau
  };

}


async function onScanSuccess(
  decodedText
) {

  if (
    scanLocked
  ) {

    return;

  }

  scanLocked =
    true;

  lockMessageEl
    .classList
    .remove(
      'hidden'
    );

  updateStatus(
    'Đã quét QR. Đang đọc dữ liệu...',
    ''
  );

  try {

    const data =
      parseQrText(
        decodedText
      );

    await stopScanner();

    document
      .getElementById(
        'khachHang'
      )
      .value =
        data.khachHang;

    document
      .getElementById(
        'donHang'
      )
      .value =
        data.donHang;

    document
      .getElementById(
        'maLenh'
      )
      .value =
        data.maLenh;

    document
      .getElementById(
        'quyCach'
      )
      .value =
        data.quyCach;

    document
      .getElementById(
        'soLuongYeuCau'
      )
      .value =
        data.soLuongYeuCau;

    updateStatus(
      'Quét thành công. Vui lòng nhập số lượng và vị trí.',
      'success'
    );

    const card =
      document.getElementById(
        'orderInfoCard'
      );

    card.scrollIntoView({
      behavior: 'smooth',
      block: 'start'
    });

    setTimeout(
      () => {

        document
          .getElementById(
            'soLuong'
          )
          .focus();

      },
      500
    );

  } catch (error) {

    scanLocked =
      false;

    lockMessageEl
      .classList
      .add(
        'hidden'
      );

    updateStatus(
      error.message,
      'error'
    );

  }

}


function onScanFailure(
  errorMessage
) {}


async function getRearCamera() {

  const cameras =
    await Html5Qrcode
      .getCameras();

  if (
    !cameras ||
    cameras.length === 0
  ) {

    throw new Error(
      'Không tìm thấy camera.'
    );

  }

  const preferred =
    cameras.find(
      camera => {

        const label =
          String(
            camera.label || ''
          )
          .toLowerCase();

        return (
          label.includes('back') ||
          label.includes('rear') ||
          label.includes('environment') ||
          label.includes('sau')
        );

      }
    );

  return (
    preferred ||
    cameras[cameras.length - 1]
  );

}


async function startScanner() {

  if (
    scannerRunning
  ) {

    return;

  }

  scanLocked =
    false;

  lockMessageEl
    .classList
    .add(
      'hidden'
    );

  updateStatus(
    'Đang mở camera...',
    ''
  );

  try {

    if (!scanner) {

      scanner =
        new Html5Qrcode(
          'reader'
        );

    }

    const camera =
      await getRearCamera();

    currentCameraId =
      camera.id;

    await scanner.start(

      {
        deviceId: {
          exact:
            currentCameraId
        }
      },

      {
        fps: 10,

        qrbox: function(
          viewfinderWidth,
          viewfinderHeight
        ) {

          const size =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.72;

          return {
            width: size,
            height: size
          };

        },

        aspectRatio: 1.0

      },

      onScanSuccess,

      onScanFailure

    );

    scannerRunning =
      true;

    updateStatus(
      'Đưa mã QR vào khung để quét.',
      ''
    );

    await updateFlashAvailability();

  } catch (error) {

    try {

      if (!scanner) {

        scanner =
          new Html5Qrcode(
            'reader'
          );

      }

      await scanner.start(

        {
          facingMode: {
            exact:
              'environment'
          }
        },

        {
          fps: 10,
          qrbox: 250,
          aspectRatio: 1.0
        },

        onScanSuccess,

        onScanFailure

      );

      scannerRunning =
        true;

      updateStatus(
        'Đang sử dụng camera sau.',
        ''
      );

      await updateFlashAvailability();

    } catch (error2) {

      scannerRunning =
        false;

      updateStatus(
        'Không thể mở camera: ' +
        error2.message,
        'error'
      );

    }

  }

}


async function stopScanner() {

  if (
    !scanner ||
    !scannerRunning
  ) {

    scannerRunning =
      false;

    return;

  }

  try {

    await scanner.stop();

  } catch (error) {

    console.log(
      error
    );

  }

  scannerRunning =
    false;

}


async function updateFlashAvailability() {

  try {

    if (
      !scanner ||
      !scanner.getRunningTrackCapabilities
    ) {

      return;

    }

    const capabilities =
      scanner
        .getRunningTrackCapabilities();

    const flashSupported =
      capabilities &&
      capabilities.torch;

    document
      .getElementById(
        'flashBtn'
      )
      .disabled =
        !flashSupported;

  } catch (error) {

    console.log(
      error
    );

  }

}


async function toggleFlash() {

  if (
    !scanner ||
    !scannerRunning
  ) {

    updateStatus(
      'Camera chưa hoạt động.',
      'error'
    );

    return;

  }

  try {

    await scanner.applyVideoConstraints({

      advanced: [
        {
          torch:
            !flashOn
        }
      ]

    });

    flashOn =
      !flashOn;

    document
      .getElementById(
        'flashBtn'
      )
      .textContent =
        flashOn
          ? '🔦 Tắt Flash'
          : '🔦 Flash';

  } catch (error) {

    updateStatus(
      'Thiết bị không hỗ trợ Flash.',
      'error'
    );

  }

}


function saveData() {

  if (
    !scanLocked
  ) {

    updateStatus(
      'Vui lòng quét QR trước.',
      'error'
    );

    return;

  }

  const khachHang =
    document
      .getElementById(
        'khachHang'
      )
      .value.trim();

  const donHang =
    document
      .getElementById(
        'donHang'
      )
      .value.trim();

  const maLenh =
    document
      .getElementById(
        'maLenh'
      )
      .value.trim();

  const quyCach =
    document
      .getElementById(
        'quyCach'
      )
      .value.trim();

  const soLuongYeuCau =
    document
      .getElementById(
        'soLuongYeuCau'
      )
      .value.trim();

  const soLuong =
    document
      .getElementById(
        'soLuong'
      )
      .value.trim();

  const viTri =
    document
      .getElementById(
        'viTri'
      )
      .value.trim();

  const ghiChu =
    document
      .getElementById(
        'ghiChu'
      )
      .value.trim();

  if (!soLuong) {

    updateStatus(
      currentMode === 'NHAP'
        ? 'Vui lòng nhập Số Lượng Nhập.'
        : 'Vui lòng nhập Số Lượng Xuất.',
      'error'
    );

    document
      .getElementById(
        'soLuong'
      )
      .focus();

    return;

  }

  if (!viTri) {

    updateStatus(
      currentMode === 'NHAP'
        ? 'Vui lòng nhập Vị Trí Nhập.'
        : 'Vui lòng nhập Vị Trí Xuất.',
      'error'
    );

    document
      .getElementById(
        'viTri'
      )
      .focus();

    return;

  }

  const saveBtn =
    document.getElementById(
      'saveBtn'
    );

  saveBtn.disabled =
    true;

  saveBtn.textContent =
    '⏳ ĐANG LƯU...';

  updateStatus(
    'Đang gửi dữ liệu...',
    ''
  );

  const requestId =
    createRequestId();

  const params =
    new URLSearchParams({

      token:
        API_TOKEN,

      action:
        'save',

      callback:
        'handleSaveResponse',

      mode:
        currentMode,

      source:
        'QR',

      requestId,

      khachHang,

      donHang,

      maLenh,

      quyCach,

      soLuongYeuCau,

      soLuong,

      viTri,

      ghiChu

    });

  const script =
    document.createElement(
      'script'
    );

  script.src =
    API_URL +
    '?' +
    params.toString();

  script.onerror =
    function() {

      saveBtn.disabled =
        false;

      saveBtn.textContent =
        '💾 LƯU DỮ LIỆU';

      updateStatus(
        'Không thể kết nối với hệ thống.',
        'error'
      );

      script.remove();

    };

  document
    .body
    .appendChild(
      script
    );

}


function handleSaveResponse(
  result
) {

  const saveBtn =
    document
      .getElementById(
        'saveBtn'
      );

  saveBtn.disabled =
    false;

  saveBtn.textContent =
    '💾 LƯU DỮ LIỆU';

  if (
    !result ||
    !result.success
  ) {

    updateStatus(
      result &&
      result.message
        ? result.message
        : 'Lưu dữ liệu thất bại.',
      'error'
    );

    return;

  }

  updateStatus(
    result.message ||
    'Đã lưu thành công.',
    'success'
  );

  document
    .getElementById(
      'soLuong'
    )
    .value =
      '';

  document
    .getElementById(
      'viTri'
    )
    .value =
      '';

  document
    .getElementById(
      'ghiChu'
    )
    .value =
      '';

  document
    .getElementById(
      'khachHang'
    )
    .value =
      '';

  document
    .getElementById(
      'donHang'
    )
    .value =
      '';

  document
    .getElementById(
      'maLenh'
    )
    .value =
      '';

  document
    .getElementById(
      'quyCach'
    )
    .value =
      '';

  document
    .getElementById(
      'soLuongYeuCau'
    )
    .value =
      '';

  scanLocked =
    false;

  lockMessageEl
    .classList
    .add(
      'hidden'
    );

  setTimeout(
    () => {
      startScanner();
    },
    500
  );

}


async function clearForm() {

  document
    .getElementById(
      'khachHang'
    )
    .value =
      '';

  document
    .getElementById(
      'donHang'
    )
    .value =
      '';

  document
    .getElementById(
      'maLenh'
    )
    .value =
      '';

  document
    .getElementById(
      'quyCach'
    )
    .value =
      '';

  document
    .getElementById(
      'soLuongYeuCau'
    )
    .value =
      '';

  document
    .getElementById(
      'soLuong'
    )
    .value =
      '';

  document
    .getElementById(
      'viTri'
    )
    .value =
      '';

  document
    .getElementById(
      'ghiChu'
    )
    .value =
      '';

  scanLocked =
    false;

  lockMessageEl
    .classList
    .add(
      'hidden'
    );

  updateStatus(
    'Đã xóa. Sẵn sàng quét QR.',
    ''
  );

  if (
    !scannerRunning
  ) {

    await startScanner();

  }

}


window.addEventListener(
  'load',
  function() {

    setMode(
      'NHAP'
    );

    startScanner();

  }
);

</script>

</body>

</html>
